worker_processes auto;

# Run workers as root so they can write to the /var/cache/nginx/tracker
# volume, which is owned by root when Docker creates it.
user root;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Cache zone for tracker.gamesdonequick.com responses
    # -------------------------------------------------------------------------

    proxy_cache_path /var/cache/nginx/tracker
        levels=1:2
        keys_zone=tracker_cache:10m
        max_size=1g
        inactive=10m
        use_temp_path=off;

    # Shared dict tracking per-URL cache hit/miss counts for /metrics.
    lua_shared_dict cache_metrics 1m;

    # Normalize a trailing slash away for the cache key.
    #
    # /tracker/api/v2/events              -> /tracker/api/v2/events
    # /tracker/api/v2/events/             -> /tracker/api/v2/events
    # /tracker/api/v2/events/123/runs     -> /tracker/api/v2/events/123/runs
    # /tracker/api/v2/events/123/runs/    -> /tracker/api/v2/events/123/runs
    map $uri $cache_uri {
        ~^(.+)/$  $1;
        default   $uri;
    }

    upstream app {
        server app:9000;
    }

    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------------
        # Metrics — Node.js app metrics with nginx cache metrics appended
        # ---------------------------------------------------------------------

        location = /metrics {
            content_by_lua_block {
                local res = ngx.location.capture("/internal/app-metrics")
                local dict = ngx.shared.cache_metrics
                local keys = dict:get_keys(0)
                table.sort(keys)

                local missLines, hitLines = {}, {}
                for _, key in ipairs(keys) do
                    local kind, url = key:match("^(%a+):(.+)$")
                    local value = dict:get(key) or 0
                    local line = string.format('%s{url="%s"} %d\n',
                        kind == "hit" and "cache_hits" or "cache_misses", url, value)
                    if kind == "hit" then
                        table.insert(hitLines, line)
                    else
                        table.insert(missLines, line)
                    end
                end

                ngx.header["Content-Type"] = "text/plain"
                ngx.print(res.body or "")
                ngx.print(table.concat(missLines))
                ngx.print(table.concat(hitLines))
            }
        }

        location = /internal/app-metrics {
            internal;
            proxy_pass http://app/metrics;
        }

        # ---------------------------------------------------------------------
        # Tracker API proxy
        #
        # Allowed paths (with optional trailing slash):
        #   /proxy/tracker/api/v2/events
        #   /proxy/tracker/api/v2/events/{id}/runs
        #
        # The /proxy prefix is stripped before forwarding to:
        #   https://tracker.gamesdonequick.com/tracker/api/v2/...
        # ---------------------------------------------------------------------

        # The tracker canonicalizes these endpoints with a trailing slash.
        # Do it internally so the cache stores the resource response, not its
        # upstream redirect.
        location ~ ^/proxy/tracker/api/v2/events(?:/[0-9]+/runs)?$ {
            rewrite ^(.+)$ $1/ last;
        }

        location ~ ^/proxy/tracker/api/v2/events(?:/?|/[0-9]+/runs/?)$ {
            add_header Access-Control-Allow-Origin "http://localhost:4437" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            rewrite ^/proxy(.*)$ $1 break;

            proxy_pass https://tracker.gamesdonequick.com;
            proxy_redirect /tracker/ /proxy/tracker/;
            proxy_ssl_server_name on;

            proxy_set_header Host tracker.gamesdonequick.com;

            # -----------------------------------------------------------------
            # Cache
            # -----------------------------------------------------------------

            proxy_cache tracker_cache;
            proxy_cache_methods GET HEAD;

            # Cache every HTTP status (including errors) for 60 seconds.
            proxy_cache_valid any 60s;

            # Only one request goes upstream while the cache entry is being
            # populated; all others wait.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 60s;
            proxy_cache_lock_age 60s;

            # Cache key: normalized path + query string.
            # $cache_uri is evaluated after the rewrite, so it reflects the
            # tracker path (e.g. /tracker/api/v2/events) without /proxy.
            proxy_cache_key "$cache_uri$is_args$args";

            proxy_ignore_headers Cache-Control Expires;

            add_header X-Cache-Status $upstream_cache_status always;

            log_by_lua_block {
                local status = ngx.var.upstream_cache_status
                if status then
                    local kind = (status == "HIT" or status == "STALE" or status == "UPDATING" or status == "REVALIDATED") and "hit" or "miss"
                    local url = "https://tracker.gamesdonequick.com" .. ngx.var.uri
                    local dict = ngx.shared.cache_metrics
                    local _, err = dict:incr(kind .. ":" .. url, 1, 0)
                    if err then
                        ngx.log(ngx.ERR, "cache_metrics incr failed: ", err)
                    end
                end
            }
        }

        # ---------------------------------------------------------------------
        # Everything else is forbidden.
        # ---------------------------------------------------------------------

        location / {
            return 404;
        }
    }
}
