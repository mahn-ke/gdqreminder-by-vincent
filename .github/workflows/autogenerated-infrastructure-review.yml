############################################################

name: Infrastructure review policy

on:
  workflow_run:
    workflows:
      - Deploy service, generate certificates, and update NGINX configuration
    types: [requested, completed]
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: infrastructure-review
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  checks: write
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: mahn-ke/.github
          ref: main
          persist-credentials: false
          path: policy-tools
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node policy-tools/tools/infrastructure-review.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}