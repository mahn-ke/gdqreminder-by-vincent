#http
version: "3.8"

x-nginx:
  cors_allow_origin: "http://localhost:4437, capacitor://localhost, http://localhost"
  cors_allow_credentials: "true"
  cors_allow_methods: "GET, OPTIONS"
  cors_allow_headers: "Content-Type, Authorization"

services:
  app:
    image: ghcr.io/mahn-ke/gdqreminder-by-vincent:latest@sha256:bbdef98b6b40eba983f30d11c951d51c8f7a3927b9ee857bf69a38fd8be850b0
    restart: on-failure:5
    command:
      - --refreshIntervalInMS=60000
      - --seqHost=${SEQ_HOST}
      - --seqAPIKey=${SEQ_API_KEY}
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/firebase/firebase.json
      - FIREBASE_JSON=${FIREBASE_JSON}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
      - SEQ_HOST=${SEQ_HOST}
      - SEQ_API_KEY=${SEQ_API_KEY}

  nginx:
    image: ghcr.io/mahn-ke/gdqreminder-by-vincent/nginx:latest
    restart: on-failure:5
    ports:
      - "3018:80"
    volumes:
      - nginx_cache:/var/cache/nginx/tracker
    depends_on:
      - app
    labels:
      prometheus.scrape: "true"
      prometheus.port: "80"
    networks:
      - default
      - prometheus

volumes:
  nginx_cache:

networks:
  default:
  prometheus:
    external: true
    name: prometheus_internal
